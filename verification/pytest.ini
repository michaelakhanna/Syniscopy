[pytest]
testpaths = tests
markers =
    quick: fast checks for core Fisher, SE(3), quanta, supervision, and packet contracts
    full: longer checks, including empirical Monte Carlo CRLB validation
    artifacts: checks that require generated Syniscopy output directories
    renderer: slow live-renderer adversarial checks
    electron: electron microscopy specific checks
    monte_carlo: stochastic estimator-vs-CRLB checks
    shape: particle shape construction and rotation-invariance checks
    visual: image-array behavioral consistency checks
    output: cross-output FIM/mask/image consistency checks
addopts = -ra
